name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci 2>/dev/null || npm install 2>/dev/null || echo "No package.json"
      - run: npx tsc --noEmit 2>/dev/null || echo "No tsconfig"
